name: Upstream Check

# Runs daily at 09:30 UTC to fetch anthropic-watch feeds and file an issue for
# Worclaude-relevant upstream changes. See docs/reference/upstream-automation.md.
#
# State persistence: `.github/upstream-state.json` lives in `actions/cache@v4`
# under key prefix `upstream-state-v3-`. The workflow does NOT push to `main`
# for state updates — main can stay fully PR-protected without exemptions.
# The cache is restored before pre-check and saved at job end.

on:
  schedule:
    - cron: '30 9 * * *'
  workflow_dispatch: {}

permissions:
  issues: write
  id-token: write

concurrency:
  group: upstream-check
  cancel-in-progress: false

env:
  LABEL_UPSTREAM: upstream
  LABEL_AUTOMATED: automated
  LABEL_FETCH_ERROR: fetch-error
  LABEL_PARSE_ERROR: parse-error

jobs:
  upstream-check:
    runs-on: ubuntu-latest
    # INVARIANT: every step that creates or closes GitHub issues is gated on
    # github.ref == 'refs/heads/main'. Feature-branch runs exercise pre-check,
    # Claude, and the parser without side effects. State persistence runs on
    # every branch but is auto-scoped by `actions/cache`'s per-ref isolation.
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --omit=optional --prefer-offline --no-audit --no-fund

      - name: Restore state cache
        uses: actions/cache/restore@v5
        with:
          path: .github/upstream-state.json
          key: upstream-state-v3-${{ github.run_id }}
          restore-keys: |
            upstream-state-v3-

      - name: Ensure labels exist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create "$LABEL_UPSTREAM" --color 0e8a16 \
            --description "Anthropic upstream change summary" 2>/dev/null || true
          gh label create "$LABEL_AUTOMATED" --color ededed \
            --description "Opened by an automated workflow" 2>/dev/null || true
          gh label create "$LABEL_FETCH_ERROR" --color d93f0b \
            --description "anthropic-watch feed unreachable" 2>/dev/null || true
          gh label create "$LABEL_PARSE_ERROR" --color d93f0b \
            --description "upstream-check Claude output failed contract parse" 2>/dev/null || true

      - name: Pre-check
        id: precheck
        run: node scripts/upstream-precheck.mjs

      # The pre-check writes `.github/upstream-state.json` directly when fetch
      # fails. The cache save step at job end persists it; no commit/push needed.

      - name: Watchdog — open feed-unreachable issue on 3rd strike
        id: watchdog-open
        if: steps.precheck.outputs.fetch_failure == 'true' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CONSECUTIVE: ${{ steps.precheck.outputs.consecutive_failures }}
          FETCH_ERROR: ${{ steps.precheck.outputs.fetch_error }}
        run: |
          if [ "$CONSECUTIVE" -lt 3 ]; then
            echo "Only $CONSECUTIVE consecutive failures — not opening watchdog yet."
            exit 0
          fi
          EXISTING=$(gh issue list --label "$LABEL_FETCH_ERROR" --state open --json number --jq 'length')
          if [ "$EXISTING" -gt 0 ]; then
            echo "Watchdog already open; skipping."
            exit 0
          fi
          TODAY=$(date -u +%Y-%m-%d)
          BODY_FILE="$RUNNER_TEMP/watchdog-body.md"
          cat > "$BODY_FILE" <<BODY
          The anthropic-watch feeds have been unreachable for ${CONSECUTIVE} consecutive runs of \`.github/workflows/upstream-check.yml\`.

          Last error:

          \`\`\`
          ${FETCH_ERROR}
          \`\`\`

          The workflow will continue to retry daily at 09:30 UTC. Trigger a manual re-check:

          \`\`\`
          gh workflow run upstream-check.yml
          \`\`\`

          This issue will be closed automatically on the first successful run.
          BODY
          URL=$(gh issue create \
            --title "upstream: anthropic-watch feeds unreachable (${TODAY})" \
            --body-file "$BODY_FILE" \
            --label "$LABEL_UPSTREAM" --label "$LABEL_AUTOMATED" --label "$LABEL_FETCH_ERROR")
          NUM="${URL##*/}"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "num=$NUM" >> "$GITHUB_OUTPUT"

          # Amend state with the watchdog issue number. The cache save step at
          # job end persists the file; no git commit/push needed.
          node -e "
            const fs = require('node:fs');
            const p = '.github/upstream-state.json';
            const s = JSON.parse(fs.readFileSync(p, 'utf8'));
            s.openWatchdogIssueNumber = ${NUM};
            fs.writeFileSync(p, JSON.stringify(s, null, 2) + '\n');
          "

      - name: Claude cross-reference
        id: claude
        # claude-code-action@v1 operates on the workflow's current checkout by
        # default (documented in its README). Feed-derived content is untrusted,
        # so --disallowedTools narrows the default toolset to Read-only.
        #
        # continue-on-error: max-turns blowups (error_max_turns) are routed to
        # the "Claude-error fallback issue" step below, which opens a manual-
        # triage issue and advances state. The job stays green so the daily
        # cadence is uninterrupted.
        if: steps.precheck.outputs.has_new == 'true' && steps.precheck.outputs.fetch_failure != 'true'
        continue-on-error: true
        uses: anthropics/claude-code-action@787c5a0ce96a9a6cfb050ea0c8f4c05f2447c251 # v1.0.133
        env:
          NEW_ITEMS_PATH: ${{ steps.precheck.outputs.new_items_path }}
          FEED_REPORT_PATH: ${{ steps.precheck.outputs.feed_report_path }}
          RUN_TIMESTAMP: ${{ steps.precheck.outputs.run_timestamp }}
          NEW_COUNT: ${{ steps.precheck.outputs.new_count }}
          KEPT_COUNT: ${{ steps.precheck.outputs.kept_count }}
          TRUNCATED_COUNT: ${{ steps.precheck.outputs.truncated_count }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: '--model claude-sonnet-4-6 --max-turns 80 --disallowedTools Edit Write Bash NotebookEdit'
          prompt: |
            You are classifying new Anthropic upstream items for the Worclaude maintainer. This is a single-pass classification: Read the two input files once, then emit your final response. Do NOT Read any Worclaude project file — all facts you need are inlined below.

            Inputs (file paths in env vars):
            - NEW_ITEMS_PATH: JSON array of new items (already capped + sorted by source priority by the precheck)
            - FEED_REPORT_PATH: run-report.json with `summary.sourcesChecked` etc.
            - RUN_TIMESTAMP: ISO timestamp of the scraper run
            - NEW_COUNT: total new items detected before the cap
            - KEPT_COUNT: items in NEW_ITEMS_PATH (≤ MAX_NEW_ITEMS, default 40)
            - TRUNCATED_COUNT: items dropped from the low-priority tail (NEW_COUNT − KEPT_COUNT)

            Tool budget: Read ONLY NEW_ITEMS_PATH and FEED_REPORT_PATH (exactly two Read calls). Bash/Edit/Write/NotebookEdit are disallowed by the action. Do NOT Read any project file — all classification rules are inlined below.

            Pre-baked facts (verified 2026-04-28, do not re-check):
            - Worclaude does NOT depend on `@anthropic-ai/sdk` or `anthropic`. API/SDK doc items are informational.
            - Agent model fields use short aliases (`sonnet`, `opus`, `haiku`) — model-ID changelog bumps do NOT affect the agent catalog.
            - Feed v1.0 schema has three `sourceCategory` values: `core`, `extended`, `community`. Community items (Reddit, HN, Twitter/X, direct GH commits on Anthropic-owned repos) are informational signal only — never autonomous-action triggers unless they explicitly name a Worclaude file.

            CLASSIFICATION RULES (mirror of docs/reference/upstream-automation.md "Classification Rules" — keep in sync):

            [CRITICAL] sources — always "Worth Action":
            - `claude-code-releases`        → affects templates/agents/**, templates/commands/*, templates/hooks/*.cjs, src/data/agents.js
            - `claude-code-changelog`       → same
            - `npm-claude-code`             → same
            - `agent-sdk-ts-changelog`      → affects src/data/agent-registry.js (isolation/triggerType/model), src/core/scaffolder.js, src/core/merger.js
            - `agent-sdk-py-changelog`      → same

            `engineering-blog`:
            - "Worth Action" only when the title/snippet describes a new workflow pattern, agent-design recommendation, skill idea, or convention. Cross-reference: docs/spec/BACKLOG.md, templates/skills/universal/*.md, CLAUDE.md Critical Rules.
            - Otherwise Informational.

            Anything else (API/SDK docs, status pages, marketing posts, community items not naming a Worclaude file) → Informational.

            Decision per item:
            - Worth Action iff source ∈ critical-list OR (source = engineering-blog AND content is a pattern/skill/convention).
            - Else Informational.

            Output: your final assistant response IS the output. Print it directly with no preamble and no trailing commentary. The action captures the transcript; the parser reads the final assistant message.

            Format — the first non-whitespace line determines the path:

            If NO items are worth action, print exactly one line (and nothing else):
              SKIP_ISSUE

            If AT LEAST ONE item is worth action, print exactly this structure:

              # Title: upstream: {KEPT_COUNT} new items to review ({YYYY-MM-DD from RUN_TIMESTAMP})
              # Body
              ## Summary
              {1–3 sentences. State counts (NEW_COUNT total, KEPT_COUNT surfaced). If TRUNCATED_COUNT > 0, mention "N additional low-priority items were not surfaced; see workflow logs."}

              ## Worth Action
              {bullets, each: **[Source] Title** ([url]({url})) — one-line why-it-matters — affected file pattern (from the rules above). Max 8 bullets.}

              ## Informational
              {bullets, each: title — source — one-line reason. Max 10 bullets. OK to group by source.}

              ## Recommended Actions
              {numbered list, max 5, ordered by urgency. Each: file pattern + the upstream change that prompts it.}

              ---
              _Generated by `.github/workflows/upstream-check.yml` on {RUN_TIMESTAMP}. Close this issue after reviewing._

            Rules:
            - Be concrete. "Check the agents" is wrong; "Check src/data/agents.js" is right. File-pattern granularity is fine — the maintainer will drill in.
            - If confidence is low, classify Informational, not Worth Action.
            - The parser is strict. Do NOT emit any text before the first contract line (`SKIP_ISSUE` or `# Title: `) in your final response. No preamble ("I've analyzed..."), no reasoning summary, no closing remark. Just the contract content.

      - name: Parse Claude output
        id: parse
        if: steps.claude.outcome == 'success'
        run: node scripts/upstream-parse.mjs "${{ steps.claude.outputs.execution_file }}"

      # Graceful fallback: Claude step blew its turn budget (error_max_turns)
      # or otherwise failed. Surface the new items via a manual-triage issue
      # and advance state so we don't re-evaluate the same items tomorrow.
      # Without this, recurring error_max_turns on busy backlog days would
      # leave the workflow red AND keep re-running expensive Claude analysis
      # on the same items.
      - name: Claude-error fallback issue
        id: claude-fallback
        if: >-
          github.ref == 'refs/heads/main'
          && steps.precheck.outputs.has_new == 'true'
          && steps.precheck.outputs.fetch_failure != 'true'
          && steps.claude.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEW_COUNT: ${{ steps.precheck.outputs.new_count }}
          KEPT_COUNT: ${{ steps.precheck.outputs.kept_count }}
          TRUNCATED_COUNT: ${{ steps.precheck.outputs.truncated_count }}
          NEW_ITEMS_PATH: ${{ steps.precheck.outputs.new_items_path }}
          RUN_TIMESTAMP: ${{ steps.precheck.outputs.run_timestamp }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          TODAY=$(date -u +%Y-%m-%d)
          BODY_FILE="$RUNNER_TEMP/claude-fallback-body.md"
          {
            echo "The upstream classifier (Claude) did not complete on \`${RUN_TIMESTAMP}\`."
            echo
            echo "**Likely cause:** \`error_max_turns\` — Claude exceeded the per-run turn budget. See workflow logs for the exact error subtype."
            echo
            echo "**Item counts:** \`${NEW_COUNT}\` total new items; \`${KEPT_COUNT}\` surfaced to the classifier; \`${TRUNCATED_COUNT}\` truncated by the precheck cap (low-priority tail)."
            echo
            echo "State has been advanced for **all** ${NEW_COUNT} new items so the next scheduled run won't re-evaluate them. Triage the list below by hand and decide whether any deserve their own issues."
            echo
            echo "## Items needing manual triage"
            echo
            echo "Capped, priority-sorted list (critical sources first):"
            echo
            echo '```json'
            cat "$NEW_ITEMS_PATH"
            echo '```'
            echo
            echo "## Workflow run"
            echo
            echo "<${RUN_URL}>"
          } > "$BODY_FILE"
          gh issue create \
            --title "upstream: classifier failed on ${TODAY} — manual review needed" \
            --body-file "$BODY_FILE" \
            --label "$LABEL_UPSTREAM" --label "$LABEL_AUTOMATED" --label "$LABEL_PARSE_ERROR"

      # Advance state on any successful parse — including SKIP. Leaving state
      # un-advanced on SKIP causes Claude to re-evaluate the same feed items
      # on every subsequent run until something is eventually deemed worth an
      # issue, which is wasteful when upstream is quiet relative to Worclaude.
      # Parse errors still skip this step so the items get re-evaluated after
      # a fix. ALSO advance on a successful claude-fallback issue: the items
      # have been surfaced via that manual-triage issue, so re-evaluation
      # tomorrow would be wasteful. The cache save step at job end persists
      # the file.
      - name: State write
        id: state-write
        if: >-
          github.ref == 'refs/heads/main'
          && steps.precheck.outputs.has_new == 'true'
          && (
            (steps.parse.outcome == 'success' && steps.parse.outputs.parse_error == '')
            || steps.claude-fallback.outcome == 'success'
          )
        env:
          NEXT_STATE_PATH: ${{ steps.precheck.outputs.next_state_path }}
        run: |
          cp "$NEXT_STATE_PATH" .github/upstream-state.json

      - name: Create issue
        id: create-issue
        if: >-
          github.ref == 'refs/heads/main'
          && steps.parse.outcome == 'success'
          && steps.parse.outputs.skip == 'false'
          && steps.parse.outputs.parse_error == ''
          && steps.state-write.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          URL=$(gh issue create \
            --title "${{ steps.parse.outputs.title }}" \
            --body-file "${{ steps.parse.outputs.body_path }}" \
            --label "$LABEL_UPSTREAM" --label "$LABEL_AUTOMATED")
          NUM="${URL##*/}"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "num=$NUM" >> "$GITHUB_OUTPUT"

      - name: Rollback — close superseded upstream issues
        if: github.ref == 'refs/heads/main' && steps.create-issue.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEW_ISSUE_NUM: ${{ steps.create-issue.outputs.num }}
        run: |
          gh issue list --label "$LABEL_UPSTREAM" --state open \
            --json number,createdAt,comments,reactionGroups \
          | node -e "
              const issues = JSON.parse(require('fs').readFileSync(0));
              const today = process.env.NEW_ISSUE_NUM;
              const cutoff = Date.now() - 24*60*60*1000;
              for (const i of issues) {
                if (String(i.number) === today) continue;
                if (new Date(i.createdAt).getTime() > cutoff) continue;
                if (i.comments > 0) continue;
                if (i.reactionGroups.some(r => r.reactors.totalCount > 0)) continue;
                console.log(i.number);
              }
            " \
          | while read num; do
              gh issue close "$num" --comment "Superseded by #$NEW_ISSUE_NUM — no interaction recorded on this issue."
            done

      - name: Watchdog — recover (close feed-unreachable issue)
        if: >-
          github.ref == 'refs/heads/main'
          && steps.precheck.outputs.fetch_failure == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_TIMESTAMP: ${{ steps.precheck.outputs.run_timestamp }}
        run: |
          OPEN_WATCHDOG=$(gh issue list --label "$LABEL_FETCH_ERROR" --state open --json number --jq '.[0].number // empty')
          if [ -z "$OPEN_WATCHDOG" ]; then
            exit 0
          fi
          gh issue close "$OPEN_WATCHDOG" \
            --comment "Feeds recovered at ${RUN_TIMESTAMP}."
          # Clear the watchdog flag locally; cache save at job end persists it.
          node -e "
            const fs = require('node:fs');
            const p = '.github/upstream-state.json';
            const s = JSON.parse(fs.readFileSync(p, 'utf8'));
            if (s.openWatchdogIssueNumber != null) {
              s.openWatchdogIssueNumber = null;
              fs.writeFileSync(p, JSON.stringify(s, null, 2) + '\n');
            }
          "

      - name: Parse-error fallback issue
        if: >-
          github.ref == 'refs/heads/main'
          && steps.parse.outcome == 'success'
          && steps.parse.outputs.parse_error != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RAW_PATH: ${{ steps.parse.outputs.raw_path }}
          PARSE_ERROR: ${{ steps.parse.outputs.parse_error }}
        run: |
          TODAY=$(date -u +%Y-%m-%d)
          gh issue create \
            --title "upstream: parse error on ${TODAY}" \
            --body-file "$RAW_PATH" \
            --label "$LABEL_UPSTREAM" --label "$LABEL_AUTOMATED" --label "$LABEL_PARSE_ERROR"

      - name: Save state cache
        if: always() && steps.precheck.outcome == 'success'
        uses: actions/cache/save@v5
        with:
          path: .github/upstream-state.json
          key: upstream-state-v3-${{ github.run_id }}

      - name: Step summary
        if: always()
        env:
          FETCH_FAILURE: ${{ steps.precheck.outputs.fetch_failure }}
          CONSECUTIVE: ${{ steps.precheck.outputs.consecutive_failures }}
          NEW_COUNT: ${{ steps.precheck.outputs.new_count }}
          KEPT_COUNT: ${{ steps.precheck.outputs.kept_count }}
          TRUNCATED_COUNT: ${{ steps.precheck.outputs.truncated_count }}
          RUN_TIMESTAMP: ${{ steps.precheck.outputs.run_timestamp }}
          CLAUDE_OUTCOME: ${{ steps.claude.outcome }}
          PARSE_OUTCOME: ${{ steps.parse.outcome }}
          PARSE_SKIP: ${{ steps.parse.outputs.skip }}
          PARSE_ERROR: ${{ steps.parse.outputs.parse_error }}
          ISSUE_NUM: ${{ steps.create-issue.outputs.num }}
          WATCHDOG_NUM: ${{ steps.watchdog-open.outputs.num }}
          CLAUDE_FALLBACK_OUTCOME: ${{ steps.claude-fallback.outcome }}
        run: |
          FETCH_STATUS="ok"
          if [ "$FETCH_FAILURE" = "true" ]; then
            FETCH_STATUS="failed (${CONSECUTIVE} consecutive)"
          fi
          PARSE_STATUS="$PARSE_OUTCOME"
          if [ "$PARSE_SKIP" = "true" ]; then
            PARSE_STATUS="skip"
          elif [ -n "$PARSE_ERROR" ]; then
            PARSE_STATUS="error: $PARSE_ERROR"
          fi
          ITEMS_LINE="${NEW_COUNT:-0}"
          if [ -n "$KEPT_COUNT" ] && [ "$KEPT_COUNT" != "$NEW_COUNT" ]; then
            ITEMS_LINE="${ITEMS_LINE} total (${KEPT_COUNT} surfaced, ${TRUNCATED_COUNT} truncated)"
          fi
          CLAUDE_LINE="${CLAUDE_OUTCOME:-skipped}"
          if [ "$CLAUDE_FALLBACK_OUTCOME" = "success" ]; then
            CLAUDE_LINE="${CLAUDE_LINE} → fallback issue opened"
          fi
          {
            echo "## Upstream Check"
            echo "- Run timestamp: ${RUN_TIMESTAMP:-n/a}"
            echo "- Fetch: ${FETCH_STATUS}"
            echo "- New items: ${ITEMS_LINE}"
            echo "- Claude: ${CLAUDE_LINE}"
            echo "- Parse: ${PARSE_STATUS:-skipped}"
            echo "- Issue: ${ISSUE_NUM:-none}"
            echo "- Watchdog: ${WATCHDOG_NUM:-none}"
          } >> "$GITHUB_STEP_SUMMARY"
